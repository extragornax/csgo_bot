version: '3.8'

services:
  vitality_bot:
    build: .
    container_name: vitality_bot
    restart: unless-stopped
    volumes:
      - ./data:/app/data
    env_file:
      - .env
    environment:
      - PORT=3000
      - STATE_PATH=/app/data/state.db
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    networks:
      - vitality_network

networks:
  vitality_network:
    driver: bridge